name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run credential-free loopback tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kindroid-home" "$RUNNER_TEMP/kindroid-tmp"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/kindroid-home" \
            HERMES_HOME="$RUNNER_TEMP/kindroid-home/.hermes" \
            TMPDIR="$RUNNER_TEMP/kindroid-tmp" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 \
            python -W error::ResourceWarning -m unittest discover -s tests -v
